<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Work out what each order actually keeps, and the most you can afford to pay for a customer. Runs entirely in your browser.">
  <title>Contribution Margin Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Condensed:wght@700&family=PT+Sans:wght@400;700&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <header class="site-header">
    <a class="text-logo" href="https://conversionalchemy.com" target="_blank" rel="noopener">ConversionAlchemy.com</a>
  </header>

  <main>
    <h1>Contribution Margin Calculator</h1>

    <div class="layout">

      <form id="cmForm" autocomplete="off">

        <p class="row-actions">
          <button class="text-link" id="openPaste" type="button">Paste From AI</button>
          <span aria-hidden="true">&bull;</span>
          <button class="text-link" id="resetAll" type="button">Reset</button>
        </p>

        <label class="field">
          <span class="field-label">Average Order Value</span>
          <span class="input-wrap"><span class="prefix">$</span><input name="aov" type="number" step="0.01" min="0" placeholder="74.50" required></span>
        </label>

        <label class="field">
          <span class="field-label">Refund Rate</span>
          <span class="input-wrap"><input name="refundRate" type="number" step="0.1" min="0" max="100" placeholder="2.5"><span class="suffix">%</span></span>
        </label>

        <label class="field">
          <span class="field-label">Product Cost</span>
          <span class="input-wrap"><span class="prefix">$</span><input name="cogs" type="number" step="0.01" min="0" placeholder="22.00"></span>
        </label>

        <label class="field">
          <span class="field-label">Shipping And Fulfilment</span>
          <span class="input-wrap"><span class="prefix">$</span><input name="shipping" type="number" step="0.01" min="0" placeholder="6.80"></span>
        </label>

        <label class="field">
          <span class="field-label">Payment Fees</span>
          <span class="input-wrap"><input name="paymentFees" type="number" step="0.01" min="0" max="100" placeholder="2.9"><span class="suffix">%</span></span>
        </label>

        <label class="field">
          <span class="field-label">Other Variable Costs</span>
          <span class="input-wrap"><span class="prefix">$</span><input name="other" type="number" step="0.01" min="0" placeholder="1.40"></span>
        </label>

        <label class="field">
          <span class="field-label">Cost To Acquire A Customer</span>
          <span class="input-wrap"><span class="prefix">$</span><input name="cac" type="number" step="0.01" min="0" placeholder="28.00"></span>
        </label>

        <label class="field">
          <span class="field-label">Orders Per Month</span>
          <span class="input-wrap"><input name="ordersPerMonth" type="number" step="1" min="0" placeholder="1800"></span>
        </label>

        <label class="field">
          <span class="field-label">Fixed Costs Per Month</span>
          <span class="input-wrap"><span class="prefix">$</span><input name="fixedCosts" type="number" step="0.01" min="0" placeholder="19000"></span>
        </label>

        <label class="field currency-field">
          <span class="field-label">Currency Symbol</span>
          <span class="input-wrap"><input name="currency" maxlength="3" value="$"></span>
        </label>

      </form>

      <section class="results-section" id="resultsSection">
        <div class="results-heading">
          <button class="text-link" id="saveAll" type="button">Save As PDF</button>
        </div>

        <div class="results-box">
          <div class="hero" id="hero"></div>
          <div class="ladder" id="ladder"></div>
          <div class="breakeven" id="breakeven" hidden></div>
          <div class="monthly" id="monthly" hidden></div>
          <p class="foot-note" id="footNote"></p>
        </div>
      </section>

    </div>
  </main>

  <dialog id="pasteDialog" aria-label="Figures code">
    <textarea id="pasteInput" rows="12" aria-label="Figures code" spellcheck="false"></textarea>
    <p class="paste-error" id="pasteError" hidden></p>
    <div class="dialog-actions">
      <button class="secondary-button" id="copyPrompt" type="button">Copy Instructions For AI</button>
      <span class="dialog-spacer"></span>
      <button class="secondary-button" id="closePaste" type="button">Cancel</button>
      <button class="primary-button" id="applyPaste" type="button">Fill Form</button>
    </div>
  </dialog>

  <div class="status-message" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
